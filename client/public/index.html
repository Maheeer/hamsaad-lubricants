<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />

    <!-- Critical: viewport-fit=cover unlocks safe-area-inset-* for iPhone notch/home bar -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable"          content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title"            content="Hamsaad" />
    <meta name="mobile-web-app-capable"                content="yes" />

    <!-- Android / Chrome PWA -->
    <meta name="theme-color" content="#1F3864" />
    <meta name="application-name" content="Hamsaad Lubricants" />

    <meta name="description" content="Hamsaad Lubricants — Inventory and Sales Management" />

    <!-- Icons -->
    <link rel="apple-touch-icon"             href="%PUBLIC_URL%/logo192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="%PUBLIC_URL%/logo192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="%PUBLIC_URL%/logo512.png" />

    <!-- PWA manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <title>Hamsaad Lubricants</title>

    <style>
      /* Instant paint while JS loads */
      html, body { height: 100%; background: #F5F5F5; }
      #root { height: 100%; }

      /* Spinner shown until React mounts */
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #root:empty::after {
        content: '';
        width: 44px; height: 44px;
        border: 4px solid #D6E4F0;
        border-top-color: #1F3864;
        border-radius: 50%;
        animation: _spin 0.75s linear infinite;
      }
      @keyframes _spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
